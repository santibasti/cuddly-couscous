# Publishes opspilot-site/ to GitHub Pages when changes reach main.
# One-time setup: repo Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Deploy OpsPilot site (GitHub Pages)
on:
  push:
    branches: [main]
    paths: ['opspilot-site/**', '.github/workflows/opspilot-site-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.mjs
        working-directory: opspilot-site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: opspilot-site/dist
      - id: deployment
        uses: actions/deploy-pages@v4

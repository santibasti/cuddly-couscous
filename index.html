<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cattle Creek Range &amp; Café Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app"><div id="boot" style="font-family:system-ui,sans-serif;padding:40px;color:#3b1a63"><b>Cattle Creek Range &amp; Café Operations</b><p>Loading… if this message stays, the app could not start. Details will appear below.</p></div></div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<noscript><p style="padding:40px;font-family:system-ui">JavaScript is turned off in this browser. Please enable it to use this app.</p></noscript>
<script>
// Startup diagnostics: if the app fails to start, say why instead of leaving a blank page.
(function () {
  function show(msg) {
    var b = document.getElementById('boot'); if (!b) return;
    var hint = location.protocol === 'file:' ? 'You opened the file directly. Start a local server (see README) and open http://localhost:PORT instead.' : 'Try Ctrl+F5. If it persists, press F12 → Application → Service Workers → Unregister, and Storage → Clear site data, then reload. Make sure the server was started inside the cuddly-couscous folder.';
    b.insertAdjacentHTML('beforeend', '<pre style="white-space:pre-wrap;background:#fbe9e9;color:#c62828;padding:12px;border-radius:8px">' + String(msg).replace(/[<&]/g, '') + '</pre><p>' + hint + '</p><p style="color:#666;font-size:13px">Page: ' + location.href + '</p>');
  }
  window.addEventListener('error', function (e) { show((e.message || 'Script error') + (e.filename ? '\n' + e.filename + ':' + e.lineno : '')); });
  window.addEventListener('unhandledrejection', function (e) { show('Promise error: ' + (e.reason && e.reason.message || e.reason)); });
  window.__bootFail = show;
})();
</script>
<script type="module" src="js/app.js" onerror="__bootFail('Could not load js/app.js — the server is probably not serving this project folder (404).')"></script>
</body>
</html>
